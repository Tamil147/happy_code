<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="20" fill="#1F2937" opacity="0.5"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Code brackets - Happy Code -->
  <!-- Left bracket < -->
  <path d="M 12 12 L 18 20 L 12 28" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right bracket > -->
  <path d="M 28 12 L 22 20 L 28 28" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center smile/happy face indicator -->
  <circle cx="20" cy="20" r="2" fill="url(#logoGradient)"/>
</svg>
